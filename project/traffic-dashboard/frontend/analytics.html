<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics - Smart Traffic Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="d-flex">
    <nav class="sidebar bg-dark text-white p-3" style="width: 260px;">
      <h5>Smart Traffic</h5>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link text-white active" href="analytics.html">Analytics</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#" onclick="logout()">Logout</a></li>
      </ul>
      <button class="btn btn-sm btn-secondary mt-3" onclick="toggleDarkMode()">Dark Mode</button>
    </nav>
    <div class="flex-grow-1 p-3">
      <h2>Traffic Analytics</h2>
      <div class="row mt-2">
        <div class="col-md-4 mb-2"><div class="card p-3"><h6>Daily Vehicle Count</h6><h4 id="dailyCount">0</h4></div></div>
        <div class="col-md-4 mb-2"><div class="card p-3"><h6>Peak Hour</h6><h4 id="peakHour">0:00</h4></div></div>
        <div class="col-md-4 mb-2"><div class="card p-3"><h6>Auto Refresh</h6><p>5 seconds</p></div></div>
      </div>
      <div class="card p-3 mt-3"><h5>Hourly Traffic Trend</h5><canvas id="analyticsChart"></canvas></div>
    </div>
  </div>
  <script src="/public/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
