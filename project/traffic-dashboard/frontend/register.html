<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - Smart Traffic Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body class="vh-100 d-flex align-items-center justify-content-center" style="background: #eef2ff;">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 420px;">
    <h3 class="mb-3">Register</h3>
    <form onsubmit="registerUser(event)">
      <div class="mb-3"><label class="form-label" for="name">Name</label><input id="name" class="form-control" type="text" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" class="form-control" type="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" class="form-control" type="password" required></div>
      <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm Password</label><input id="confirmPassword" class="form-control" type="password" required></div>
      <button type="submit" class="btn btn-success w-100">Register</button>
      <div class="mt-3 text-center">Already have account? <a href="login.html">Login</a></div>
    </form>
  </div>
  <script src="/public/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
